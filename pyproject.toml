[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeseam"
version = "0.1.0"
description = "Codebase refactoring reports"
readme = "README.md"
requires-python = ">=3.12"

keywords = [
  "refactoring",
  "static-analysis",
  "code-quality",
  "deduplication",
  "cli",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
]

dependencies = [
  "jinja2>=3.1.4",
  "jsonschema>=4.23.0",
  "rich>=15.0.0",
  "tree-sitter>=0.25.2",
  "tree-sitter-javascript>=0.25.0",
  "tree-sitter-typescript>=0.23.2",
]

[project.scripts]
codeseam = "codeseam.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codeseam"]

[tool.hatch.build.targets.wheel.force-include]
"src/codeseam/output/reports/templates" = "codeseam/output/reports/templates"

[dependency-groups]
dev = [
  "basedpyright>=1.24.0",
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.8.0",
  "vulture>=2.16",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["tests/fixtures"]
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PL"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
exclude = ["tests/fixtures"]
cache_dir = ".cache/mypy"

[tool.pytest.ini_options]
cache_dir = ".cache/pytest"

[tool.coverage.run]
branch = true
data_file = ".cache/coverage/.coverage"
source = ["codeseam"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.coverage.html]
directory = ".cache/coverage/html"

[tool.coverage.xml]
output = ".cache/coverage/coverage.xml"

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src/codeseam", "tests"]
exclude = ["tests/fixtures"]

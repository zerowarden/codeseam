# Answer key for the benchmark corpus, written before the tool was first run.
#
# expect = "positive": should surface as a refactor target.
# expect = "negative": looks similar but behaves differently, or is too small to
#                      be worth sharing; must never be a recommended edit (a
#                      cautious maintenance note is fine).
# category:            the clone type, used for per-category recall.
#
# What the tool currently achieves lives in baseline.json (tests/benchmark.py).
#
# Targets only expose file paths, so a target matches a case when its files are
# a subset of the case's member files.

[[case]]
id = "PA"
category = "type-1"
kind = "type-1 exact copy"
expect = "positive"
members = ["py/ingest/csv_loader.py:normalize_records", "py/export/serializer.py:normalize_records"]

[[case]]
id = "PB1"
category = "type-2"
kind = "type-2 README 'same job, different words'"
expect = "positive"
members = ["py/shop/users.py:load_users", "py/shop/products.py:read_products", "py/shop/orders.py:get_orders"]

[[case]]
id = "PB2"
category = "type-2"
kind = "type-2 renamed"
expect = "positive"
members = ["py/stats/scores.py:summarize_scores", "py/stats/latency.py:aggregate_latencies"]

[[case]]
id = "PC1"
category = "type-3"
kind = "type-3 added statement"
expect = "positive"
members = ["py/config/env_file.py:parse_env_lines", "py/config/properties_file.py:parse_properties_lines"]

[[case]]
id = "PC2"
category = "type-3"
kind = "type-3 removed call"
expect = "positive"
members = ["py/users/registration.py:register_user", "py/users/invites.py:accept_invite"]

[[case]]
id = "PD1"
category = "type-4"
kind = "type-4 same behaviour, different syntax"

# Added with M15 (REVIEW.md), from recommended-tier false positives on
# third-party code, before the fix: exact copies of one-operation bodies, and
# one-line copies that do encode a rule and are worth sharing.

[[case]]
id = "PE5"
category = "negative"
kind = "hooks that each make one call"
expect = "negative"
members = ["py/hooks/lifecycle.py:*"]

[[case]]
id = "PE6"
category = "negative"
kind = "constant-returning protocol methods"
expect = "negative"
members = ["py/io/null_stream.py:*", "py/io/closed_stream.py:*"]

[[case]]
id = "PG1"
category = "type-1"
kind = "type-1 one-line normalization rule"
expect = "positive"
members = ["py/text/report_lines.py:report_single_line", "py/text/log_lines.py:log_single_line"]

[[case]]
id = "TE5"
category = "negative"
kind = "logger wrappers that each make one call"
expect = "negative"
members = ["ts/src/lib/logger.ts:*"]

[[case]]
id = "TE6"
category = "negative"
kind = "constant-returning methods"
expect = "negative"
members = ["ts/src/cache/null-cache.ts:*", "ts/src/cache/disabled-cache.ts:*"]

[[case]]

expect = "positive"
members = ["py/rules/checkout.py:can_checkout", "py/rules/discounts.py:can_apply_discount", "py/rules/invoices.py:can_generate_invoice"]

[[case]]
id = "PE1a"
category = "negative"
kind = "operator + vs -"
expect = "negative"

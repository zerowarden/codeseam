[project]
repo_root = "auto"

[output]
root = ".codeseam/reports"

[selection]
include = ["**/*"]
exclude = []

[agent_summary]
# 0 means include all listed actionable targets.
max_targets = 0

[cache]
enabled = true
path = ".codeseam/cache"

[relations]
split_test = true

[semantics]
mode = "off"
# Starting a compiler worker loads tooling from the analysed repository.
trust_project_code = false
